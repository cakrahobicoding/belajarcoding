<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Akun — KodeMulai</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo-row"><span class="brand-badge">&lt;/&gt;</span> KodeMulai</div>
    <h1>Buat akun baru</h1>
    <p class="sub">Akun sendiri, bukan login Google ya~ Sekali daftar, lain kali tinggal masuk.</p>

    <div class="form-msg" id="msg"></div>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="3-20 karakter, huruf/angka/underscore">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="minimal 6 karakter">
    </div>
    <div class="field">
      <label for="password2">Ulangi Password</label>
      <input id="password2" type="password" autocomplete="new-password" placeholder="••••••••">
    </div>

    <div class="turnstile-wrap">
      <div class="cf-turnstile" id="turnstile-widget"></div>
    </div>

    <button class="btn btn-primary btn-block" id="btn-register">Buat Akun</button>

    <div class="auth-switch">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </div>
  </div>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="js/turnstile-config.js"></script>
<script src="js/api-config.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('turnstile-widget').setAttribute('data-sitekey', TURNSTILE_SITE_KEY);

  (async () => {
    await KM.boot('');

    const msg = document.getElementById('msg');
    function showMsg(text, ok) {
      msg.textContent = text;
      msg.className = 'form-msg show ' + (ok ? 'ok' : 'err');
    }

    const registerBtn = document.getElementById('btn-register');
    registerBtn.addEventListener('click', async () => {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      const turnstileToken = window.turnstile ? turnstile.getResponse() : '';

      if (p !== p2) {
        showMsg('Password sama ulangannya harus sama dong, Baka! 😤', false);
        return;
      }

      registerBtn.disabled = true;
      const res = await KM.register(u, p, turnstileToken);
      if (res.ok) {
        await KM.login(u, p, turnstileToken);
        showMsg('Akun berhasil dibuat! Mengalihkan ke profil kamu~', true);
        setTimeout(() => location.href = 'profile.html', 700);
      } else {
        showMsg(res.msg, false);
        registerBtn.disabled = false;
        if (window.turnstile) turnstile.reset();
      }
    });
  })();
</script>
</body>
</html>
